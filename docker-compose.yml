services:

  memory-service:

    build:
      context: .

    container_name: memory-service

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434

    depends_on:
      - qdrant


  qdrant:

    image: qdrant/qdrant:latest

    container_name: qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - ./data/qdrant:/qdrant/storage