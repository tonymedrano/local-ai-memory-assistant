services:

  memory-service:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: memory-service-dev

    ports:
      - "3000:3000"

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - /app/node_modules

    environment:
      NODE_ENV: development
      AUTH_MODE: ${AUTH_MODE:?AUTH_MODE=jwt is required for secure local development}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for secure local development}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_TENANT_CLAIM: ${JWT_TENANT_CLAIM:-tenantId}
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434

    depends_on:
      - qdrant


  qdrant:
    image: qdrant/qdrant:latest

    container_name: qdrant-dev

    ports:
      - "6333:6333"

    volumes:
      - ./data/qdrant:/qdrant/storage
